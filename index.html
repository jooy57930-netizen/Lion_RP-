<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="google0ada2f7d422b47ac.html" />
    <title>LEON RP - التقديم</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #222;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #ffcc00;
        }
        h2 {
            color: #ffcc00;
        }
        .camera-box {
            position: relative;
            width: 100%;
            border: 2px solid #ffcc00;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            height: 350px;
            object-fit: contain; /* الكاميرا كاملة بدون قص */
            background: #000;
        }
        button {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            width: 95%;
        }
        label {
            display: block;
            text-align: right;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #ffcc00;
        }
        input, textarea {
            width: 90%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #333;
            color: white;
            text-align: right;
            font-family: Arial, sans-serif;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>نموذج التقديم والتحقق</h2>
    
    <div class="camera-box">
        <video id="webcam" autoplay playsinline muted></video>
    </div>
    <button type="button" onclick="takeSnapshot()">📷 التقاط الصورة</button>
    <p style="font-size: 12px; color: #aaa;">يرجى السماح بالكاميرا والتقاط صورة للتحقق</p>

    <hr style="border: 0.5px solid #444; margin: 20px 0;">

    <label>الاسم الحقيقي:</label>
    <input type="text" placeholder="أدخل اسمك الحقيقي الكامل">

    <label>العمر:</label>
    <input type="number" placeholder="أدخل عمرك">

    <label>اسم الشخصية الواقعي (داخل اللعبة):</label>
    <input type="text" placeholder="مثل: John_Doe">

    <label>قصة الشخصية (Backstory):</label>
    <textarea placeholder="اكتب قصة شخصيتك وتفاصيل حياتها داخل المدينة..."></textarea>

    <label>لماذا انضممت إلينا؟</label>
    <textarea style="height: 60px;" placeholder="اكتب السبب هنا..."></textarea>

    <button type="submit" style="background: #28a745; color: white; margin-top: 25px;">إرسال التقديم</button>
</div>

<script>
    const video = document.getElementById('webcam');

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: "user" 
            }, 
            audio: false 
        })
        .then(function(stream) {
            video.srcObject = stream;
            video.play();
        })
        .catch(function(err) {
            console.error("خطأ في تشغيل الكاميرا: ", err);
            alert("تأكد من السماح للمتصفح بالوصول إلى الكاميرا.");
        });
    } else {
        alert("متصفحك لا يدعم تشغيل الكاميرا مباشرة.");
    }
</script>

</body>
</html>
